[project]
name = "a2a-mcp-lab"
version = "0.1.0"
description = "Local A2A to MCP security research lab"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "sse-starlette>=3,<4",
  "PyYAML>=6,<7",
  "a2a-sdk==1.3.0",
  "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "services"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
